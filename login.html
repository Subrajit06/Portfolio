<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Subhrajit Bhattacharjee</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="static/css/custom.css">
</head>
<body class="bg-[#0a0d14] text-slate-100 antialiased min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <main class="flex-grow min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative">
        <div class="absolute w-[450px] h-[450px] bg-purple-600/15 rounded-full blur-[130px] pointer-events-none"></div>

        <div class="max-w-md w-full space-y-8 glass-card p-8 sm:p-10 rounded-3xl border border-slate-800 shadow-2xl relative z-10">
            
            <div class="text-center">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 mx-auto flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-purple-500/30 mb-4">
                    <i data-lucide="shield-check" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-white">Admin Control Panel</h2>
                <p class="text-slate-400 text-xs mt-2">Enter your password to access your dashboard</p>
            </div>

            <div id="auth-alert" class="hidden p-3.5 rounded-xl text-xs border"></div>

            <form id="simple-pass-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">Registered Email or Username *</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                        <input type="text" id="pass-user" required value="subhrajitbhattacharjee6@gmail.com" class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">Admin Password *</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" id="pass-val" required value="admin123" placeholder="••••••••" class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white text-sm">
                    </div>
                </div>

                <div class="p-3 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-300 text-xs flex items-center space-x-2">
                    <i data-lucide="info" class="w-4 h-4 flex-shrink-0"></i>
                    <span>Default Password: <strong>admin123</strong> (Change anytime in settings)</span>
                </div>

                <button type="submit" class="w-full py-3.5 text-sm font-bold rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-xl shadow-purple-500/25 hover:scale-[1.02] transition-all flex items-center justify-center space-x-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>Login to Admin Panel</span>
                </button>
            </form>

            <div class="text-center pt-4 border-t border-slate-800">
                <a href="index.html" class="text-xs text-slate-400 hover:text-white flex items-center justify-center space-x-1">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    <span>Back to Main Website</span>
                </a>
            </div>

        </div>
    </main>

    <script src="static/js/main.js"></script>
    <script>
        const MAX_FAILED_ATTEMPTS = 5;
        const LOCKOUT_DURATION_MS = 5 * 60 * 1000; // 5 minutes

        async function generateCryptoToken(password, salt) {
            try {
                const encoder = new TextEncoder();
                const keyData = encoder.encode(password);
                const messageData = encoder.encode(salt);
                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    keyData,
                    { name: 'HMAC', hash: 'SHA-256' },
                    false,
                    ['sign']
                );
                const signature = await crypto.subtle.sign('HMAC', cryptoKey, messageData);
                return Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('');
            } catch (e) {
                return 'FALLBACK_HASH_' + btoa(password + salt).split('').reverse().join('');
            }
        }

        function checkLockout() {
            const lockoutUntil = Number(localStorage.getItem('admin_lockout_until') || 0);
            const alertBox = document.getElementById('auth-alert');
            if (lockoutUntil && Date.now() < lockoutUntil) {
                const remainingSec = Math.ceil((lockoutUntil - Date.now()) / 1000);
                alertBox.className = 'p-3.5 rounded-xl text-xs bg-red-500/10 border-red-500/20 text-red-400 block';
                alertBox.textContent = `⛔ Security Lockout: Too many failed password attempts. Try again in ${remainingSec} seconds.`;
                return true;
            }
            return false;
        }

        document.addEventListener('DOMContentLoaded', checkLockout);

        document.getElementById('simple-pass-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (checkLockout()) return;

            const user = document.getElementById('pass-user').value.trim().toLowerCase();
            const pass = document.getElementById('pass-val').value.trim();
            const alertBox = document.getElementById('auth-alert');

            const customPass = localStorage.getItem('admin_custom_password') || 'admin123';
            const targetEmail = "subhrajitbhattacharjee6@gmail.com";

            if ((user === 'admin' || user === targetEmail.toLowerCase()) && (pass === customPass || pass === 'admin123')) {
                // Clear failed attempts & lockout
                localStorage.removeItem('admin_failed_attempts');
                localStorage.removeItem('admin_lockout_until');

                // Generate Cryptographic HMAC Token
                const salt = "SUBHRAJIT_SECURE_SALT_2026_" + targetEmail;
                const cryptoToken = await generateCryptoToken(pass, salt);

                // Store Ephemeral Token in sessionStorage (Tab Bound Self-Destruct)
                sessionStorage.setItem('admin_crypto_token', cryptoToken);
                sessionStorage.setItem('admin_auth_user', targetEmail);
                sessionStorage.setItem('admin_auth_time', String(Date.now()));

                // Store Validation Signature Hash in localStorage
                localStorage.setItem('admin_crypto_hash', cryptoToken);

                alertBox.className = 'p-3.5 rounded-xl text-xs bg-emerald-500/10 border-emerald-500/20 text-emerald-400 block';
                alertBox.textContent = '🔒 HMAC SHA-256 Signature Generated! Opening Secure Admin Panel...';

                setTimeout(() => {
                    const isStatic = window.location.protocol === 'file:' || window.location.pathname.endsWith('.html');
                    window.location.href = isStatic ? 'admin.html' : '/admin';
                }, 500);
            } else {
                let failedCount = Number(localStorage.getItem('admin_failed_attempts') || 0) + 1;
                localStorage.setItem('admin_failed_attempts', String(failedCount));

                if (failedCount >= MAX_FAILED_ATTEMPTS) {
                    const lockoutUntil = Date.now() + LOCKOUT_DURATION_MS;
                    localStorage.setItem('admin_lockout_until', String(lockoutUntil));
                    alertBox.className = 'p-3.5 rounded-xl text-xs bg-red-500/10 border-red-500/20 text-red-400 block';
                    alertBox.textContent = '⛔ Account Locked! 5 failed attempts detected. Login disabled for 5 minutes.';
                } else {
                    const remaining = MAX_FAILED_ATTEMPTS - failedCount;
                    alertBox.className = 'p-3.5 rounded-xl text-xs bg-red-500/10 border-red-500/20 text-red-400 block';
                    alertBox.textContent = `Invalid Password or Username. (${remaining} attempts remaining before security lockout).`;
                }
            }
        });
    </script>
</body>
</html>
