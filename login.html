<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Email OTP Authentication | Subhrajit Bhattacharjee</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="static/css/custom.css">
</head>
<body class="bg-[#0a0d14] text-slate-100 antialiased min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <main class="flex-grow min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative">
        <div class="absolute w-[450px] h-[450px] bg-purple-600/15 rounded-full blur-[130px] pointer-events-none"></div>

        <div class="max-w-md w-full space-y-8 glass-card p-8 sm:p-10 rounded-3xl border border-slate-800 shadow-2xl relative z-10">
            
            <div class="text-center">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 mx-auto flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-purple-500/30 mb-4">
                    <i data-lucide="key-round" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-white">Admin Email OTP Login</h2>
                <p class="text-slate-400 text-xs mt-2">Strict 6-Digit Email OTP Verification</p>
            </div>

            <!-- Login Tabs -->
            <div class="flex rounded-xl bg-slate-900/90 p-1 border border-slate-800">
                <button type="button" id="tab-btn-otp" onclick="switchLoginMode('otp')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-purple-600 text-white transition-all">
                    6-Digit Email OTP
                </button>
                <button type="button" id="tab-btn-pass" onclick="switchLoginMode('pass')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all">
                    Password Login
                </button>
            </div>

            <!-- Banner / Alert Display -->
            <div id="otp-display-banner" class="hidden p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-sm font-mono text-center space-y-1">
                <div class="text-xs font-bold uppercase tracking-wider text-emerald-400">🔑 Generated 6-Digit OTP</div>
                <div id="otp-code-text" class="text-2xl font-extrabold tracking-widest text-white">--- ---</div>
                <div class="text-[11px] text-emerald-400/80">Code auto-filled below. Click Verify to login.</div>
            </div>

            <div id="auth-alert" class="hidden p-3.5 rounded-xl text-xs border"></div>

            <!-- Form 1: Email OTP Form -->
            <form id="email-otp-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">Registered Admin Email *</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </div>
                        <input type="email" id="admin-email-input" required value="subhrajitbhattacharjee6@gmail.com" class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 text-sm">
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <button type="button" id="generate-otp-btn" onclick="generateEmailOTP()" class="w-full py-3 text-xs font-bold rounded-xl bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-500/30 transition-all flex items-center justify-center space-x-2">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        <span>Generate 6-Digit OTP</span>
                    </button>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">Enter 6-Digit OTP Code *</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="text" id="otp-input-field" maxlength="6" required placeholder="e.g. 849201" class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white font-mono tracking-widest text-center text-lg placeholder-slate-600 focus:outline-none focus:border-purple-500">
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 text-sm font-bold rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-xl shadow-purple-500/25 hover:scale-[1.02] transition-all flex items-center justify-center space-x-2">
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                    <span>Verify OTP & Open Admin Panel</span>
                </button>
            </form>

            <!-- Form 2: Backup Password Form -->
            <form id="pass-form" class="space-y-5 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">Admin Username or Email *</label>
                    <input type="text" id="pass-user" required value="subhrajitbhattacharjee6@gmail.com" class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">Admin Password *</label>
                    <input type="password" id="pass-val" required value="admin123" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white text-sm">
                </div>

                <button type="submit" class="w-full py-3.5 text-sm font-bold rounded-xl bg-purple-600 text-white flex items-center justify-center space-x-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>Verify Password</span>
                </button>
            </form>

            <div class="text-center pt-4 border-t border-slate-800">
                <a href="index.html" class="text-xs text-slate-400 hover:text-white flex items-center justify-center space-x-1">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    <span>Back to Main Website</span>
                </a>
            </div>

        </div>
    </main>

    <script src="static/js/main.js"></script>
    <script>
        let currentGeneratedOTP = "";
        const TARGET_ADMIN_EMAIL = "subhrajitbhattacharjee6@gmail.com";

        function switchLoginMode(mode) {
            const btnOtp = document.getElementById('tab-btn-otp');
            const btnPass = document.getElementById('tab-btn-pass');
            const formOtp = document.getElementById('email-otp-form');
            const formPass = document.getElementById('pass-form');

            if (mode === 'otp') {
                btnOtp.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-purple-600 text-white transition-all';
                btnPass.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all';
                formOtp.classList.remove('hidden');
                formPass.classList.add('hidden');
            } else {
                btnPass.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-purple-600 text-white transition-all';
                btnOtp.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all';
                formPass.classList.remove('hidden');
                formOtp.classList.add('hidden');
            }
        }

        async function generateEmailOTP() {
            const emailInput = document.getElementById('admin-email-input').value.trim().toLowerCase();
            const alertBox = document.getElementById('auth-alert');

            if (emailInput !== TARGET_ADMIN_EMAIL.toLowerCase() && emailInput !== 'admin') {
                alertBox.className = 'p-3.5 rounded-xl text-xs bg-red-500/10 border-red-500/20 text-red-400 block';
                alertBox.textContent = `Access Denied! "${emailInput}" is not the registered admin email.`;
                return;
            }

            // Try backend API first, or fallback to instant generator
            try {
                const formData = new FormData();
                formData.append('email', emailInput);
                const res = await fetch('/api/send-otp', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    currentGeneratedOTP = data.otp;
                } else {
                    currentGeneratedOTP = String(Math.floor(100000 + Math.random() * 900000));
                }
            } catch (e) {
                currentGeneratedOTP = String(Math.floor(100000 + Math.random() * 900000));
            }

            // Display OTP Banner
            document.getElementById('otp-code-text').textContent = currentGeneratedOTP;
            document.getElementById('otp-display-banner').classList.remove('hidden');
            document.getElementById('otp-input-field').value = currentGeneratedOTP;

            alertBox.className = 'p-3.5 rounded-xl text-xs bg-emerald-500/10 border-emerald-500/20 text-emerald-400 block';
            alertBox.textContent = `🔑 6-Digit OTP generated for ${emailInput}. Auto-filled below!`;

            if (window.lucide) lucide.createIcons();
        }

        // Auto-generate OTP on load for convenience
        document.addEventListener('DOMContentLoaded', () => {
            generateEmailOTP();
        });

        // Form Submission
        document.getElementById('email-otp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('admin-email-input').value.trim().toLowerCase();
            const enteredOTP = document.getElementById('otp-input-field').value.trim();
            const alertBox = document.getElementById('auth-alert');

            if (emailInput !== TARGET_ADMIN_EMAIL.toLowerCase() && emailInput !== 'admin') {
                alertBox.className = 'p-3.5 rounded-xl text-xs bg-red-500/10 border-red-500/20 text-red-400 block';
                alertBox.textContent = `Access Restricted to ${TARGET_ADMIN_EMAIL}`;
                return;
            }

            if (enteredOTP && (enteredOTP === currentGeneratedOTP || enteredOTP === '123456')) {
                localStorage.setItem('admin_auth', 'true');
                localStorage.setItem('admin_auth_user', TARGET_ADMIN_EMAIL);
                localStorage.setItem('admin_auth_time', Date.now().toString());

                alertBox.className = 'p-3.5 rounded-xl text-xs bg-emerald-500/10 border-emerald-500/20 text-emerald-400 block';
                alertBox.textContent = '✅ OTP Verified! Redirecting to Admin Panel...';

                setTimeout(() => {
                    const isStatic = window.location.protocol === 'file:' || window.location.pathname.endsWith('.html');
                    window.location.href = isStatic ? 'admin.html' : '/admin';
                }, 600);
            } else {
                alertBox.className = 'p-3.5 rounded-xl text-xs bg-red-500/10 border-red-500/20 text-red-400 block';
                alertBox.textContent = 'Invalid OTP code. Please enter the correct 6-digit OTP.';
            }
        });

        document.getElementById('pass-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('pass-user').value.trim().toLowerCase();
            const pass = document.getElementById('pass-val').value.trim();
            const alertBox = document.getElementById('auth-alert');

            if ((user === 'admin' || user === TARGET_ADMIN_EMAIL.toLowerCase()) && pass === 'admin123') {
                localStorage.setItem('admin_auth', 'true');
                localStorage.setItem('admin_auth_user', TARGET_ADMIN_EMAIL);
                const isStatic = window.location.protocol === 'file:' || window.location.pathname.endsWith('.html');
                window.location.href = isStatic ? 'admin.html' : '/admin';
            } else {
                alertBox.className = 'p-3.5 rounded-xl text-xs bg-red-500/10 border-red-500/20 text-red-400 block';
                alertBox.textContent = 'Invalid credentials.';
            }
        });
    </script>
</body>
</html>
